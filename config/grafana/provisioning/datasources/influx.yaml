apiVersion: 1
datasources:
  - name: Fábrica (InfluxDB)
    uid: influx-fabrica
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: demo
      defaultBucket: fabrica
      tlsSkipVerify: true
    secureJsonData:
      token: demo-token-fabrica
